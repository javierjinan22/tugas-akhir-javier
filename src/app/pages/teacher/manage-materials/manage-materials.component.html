<div class="container-fluid mt-4 custom-materi-container">
  <h2 class="fw-bold mb-4" style="font-size: 24px;">Daftar materi anda</h2>

  <div class="d-flex justify-content-end align-items-center mb-3">
    <button class="btn btn-primary-custom" (click)="onTambah()">
      Tambah
    </button>
  </div>

  <div class="d-flex justify-content-end align-items-center mb-3">
    <div class="search-bar d-flex align-items-center">
      <input 
        #searchInput
        type="text"
        class="form-control rounded-pill me-2"
        placeholder="Cari"
        [(ngModel)]="keyword"
        (keydown.enter)="onSearch()"
        style="width: 230px;" />

      <span class="search-icon" (click)="onSearch()">
        <i class="fa fa-search"></i>
      </span>
    </div>
  </div>

  <div class="table-responsive">
    <table class="table align-middle table-bordered text-center">
      <thead>
        <tr>
          <th>No.</th>
          <th>Judul Materi</th>
          <th>Kelas tertaut</th>
          <th>Aksi</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let materi of filteredMateri; let i = index">
          <td>{{ i + 1 }}.</td>
          <td>{{ materi.judul }}</td>
          <td>{{ materi.kelas.join(', ') }}</td>
          <td class="aksi-cell">
            <a href="#" (click)="lihatMateri(materi)">Lihat</a>
            <span class="aksi-separator"></span>
            <a [routerLink]="['/guru/kelola-materi/edit-materi']" (click)="editMateri()">Edit</a>
            <span class="aksi-separator"></span>
            <a href="#" (click)="hapusMateri(materi)">Hapus</a>
          </td>
        </tr>
        <tr *ngIf="filteredMateri.length === 0">
          <td colspan="4" class="text-center text-secondary py-4">Data tidak ditemukan.</td>
        </tr>
      </tbody>
    </table>
  </div>
</div>

<router-outlet></router-outlet>

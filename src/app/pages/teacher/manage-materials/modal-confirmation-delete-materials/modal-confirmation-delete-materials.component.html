<div class="modal-content custom-modal-content">
  <div class="modal-body position-relative">
    <!-- Icon Warning Overlapping -->
    <div class="icon-warning-wrapper">
      <fa-icon [icon]="faExclamation"></fa-icon>
    </div>

    <h5 class="modal-title text-center mt-4">Konfirmasi Penghapusan Materi</h5>
    
    <div class="text-center mt-3">
      <p class="material-name">Apakah anda yakin menghapus materi <strong>"{{ materialData?.judul }}"</strong>?</p>
      <p class="subtitle">Data yang sudah terhapus tidak dapat dipulihkan kembali</p>
    </div>
    
    <div class="d-flex justify-content-center mt-4">
      <!-- Card Hapus Permanen -->
      <div class="action-card delete-card text-center" (click)="deleteMaterial()">
        <div class="icon-wrapper">
          <fa-icon [icon]="faTrash" size="2x"></fa-icon>
        </div>
        <h6 class="action-title">Hapus Permanen</h6>
        <p class="action-text">Materi akan dihapus secara permanen dan tidak dapat dibatalkan</p>
      </div>
    </div>

    <div class="d-flex justify-content-center mt-4">
      <button type="button" class="btn btn-cancel" (click)="cancelAction()">
        Batal
      </button>
    </div>
  </div>
</div>

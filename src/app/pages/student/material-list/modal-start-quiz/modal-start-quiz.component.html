<div class="modal-body position-relative">
  <!-- Icon Warning Overlapping -->
  <div class="icon-warning-wrapper">
    <div class="icon-warning">
      <fa-icon [icon]="faExclamation"></fa-icon>
    </div>
  </div>

  <h5 class="modal-title text-center mt-4">Anda yakin mengerjakan kuis sekarang?</h5>

  <!-- ✅ Tambah info quiz -->
  <div *ngIf="materialTitle || waktuPengerjaan || totalQuestions" class="quiz-info mt-3 p-3 bg-light rounded">
    <div *ngIf="materialTitle" class="mb-2">
      <strong>Materi:</strong> {{ materialTitle }}
    </div>
    <div *ngIf="totalQuestions" class="mb-2">
      <strong>Jumlah Soal:</strong> {{ totalQuestions }} soal
    </div>
    <div *ngIf="waktuPengerjaan" class="mb-2">
      <strong>Waktu:</strong> {{ waktuPengerjaan }} menit
    </div>
  </div>

  <div class="d-flex justify-content-between mt-4 px-3">
    <button class="btn btn-outline-primary btn-rounded" (click)="onCancelClicked()">
      Batal
    </button>
    <button class="btn btn-primary btn-rounded" (click)="onSubmitClicked()">
      Mulai kerjakan
    </button>
  </div>
</div>

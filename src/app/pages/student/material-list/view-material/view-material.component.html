<div class="view-material-container">
  <div class="row">
    <!-- Main content area -->
    <div class="col-md-8">
      <div class="material-content-card">
        <div class="material-header">
          <button class="back-button" (click)="goBack()">
            <i class="fa-solid fa-arrow-left"></i>
          </button>
          <h4 class="material-title">{{ material?.title }}</h4>
        </div>

        <div class="material-content">
          <!-- Render current page content -->
          <div class="material-page" [innerHTML]="currentPageContent"></div>
        </div>

        <div class="pagination-controls">
          <button class="btn btn-icon" [disabled]="currentPageIndex === 0" (click)="previousPage()">
            <i class="fas fa-chevron-left"></i>
          </button>
          <span class="page-indicator">{{ currentPageIndex + 1 }} / {{ material.pages.length }}</span>
          <button class="btn btn-icon" [disabled]="currentPageIndex === material.pages.length - 1" (click)="nextPage()">
            <i class="fas fa-chevron-right"></i>
          </button>
        </div>
      </div>
    </div>

    <!-- Sidebar with progress -->
    <div class="col-md-4">
      <div class="progress-sidebar">
        <div class="progress-section">
          <div class="progress-header">
            <span>{{ material.progress }}% Selesai</span>
          </div>
          <div class="progress-bar-wrapper">
            <div class="progress-bar" [style.width.%]="material.progress"></div>
          </div>
        </div>

        <div class="status-section">
          <!-- Status Materi (keseluruhan) -->
          <div class="status-item">
            <div class="status-circle" [ngClass]="{'checked': material.isRead}">
              <i *ngIf="material.isRead" class="fas fa-check"></i>
            </div>
            <span class="status-text">Materi</span>
          </div>
          
          <!-- ✅ TAMBAH: Daftar Bab dengan title -->
          <div class="bab-list-section" *ngIf="material?.pages && material.pages.length > 0">
            <div class="bab-header">
              <span class="bab-title">Daftar Bab:</span>
            </div>
            
            <div class="bab-item" 
                 *ngFor="let page of material.pages; let i = index" 
                 [ngClass]="{'current-bab': i === currentPageIndex}"
                 (click)="loadPage(i)">
              <div class="status-circle small" [ngClass]="{'checked': page.isRead}">
                <i *ngIf="page.isRead" class="fas fa-check"></i>
              </div>
              <span class="bab-text" [title]="page.title">
                {{ i + 1 }}. {{ page.title | slice:0:30 }}{{ page.title.length > 30 ? '...' : '' }}
              </span>
            </div>
          </div>
          
          <!-- Status Kuis -->
          <div class="status-item">
            <div class="status-circle" [ngClass]="{'checked': material.quizCompleted}">
              <i *ngIf="material.quizCompleted" class="fas fa-check"></i>
            </div>
            <span class="status-text">Kuis Latihan</span>
          </div>
        </div>

        <div class="action-section mt-auto">
          <button [class]="getQuizButtonClass()" [disabled]="!canTakeQuiz()" (click)="takeQuiz()">
            <span>{{ getQuizButtonText() }}</span>
            <i class="fas fa-arrow-right"></i>
          </button>
        </div>
        
      </div>
    </div>
  </div>
</div>

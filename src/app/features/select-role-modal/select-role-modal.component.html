
<div class="modal-content custom-modal-content">
  <div class="modal-header border-0 justify-content-center">
    <h5 class="modal-title">Daftar sebagai</h5>
  </div>

  <div class="modal-body d-flex justify-content-center gap-4">
    <!-- Card Siswa -->
    <div class="role-card text-center" (click)="onRoleSelected('siswa')">
      <div class="icon-wrapper">
        <fa-icon [icon]="faGraduationCap" size="5x"></fa-icon>
      </div>
      <p class="role-text">Siswa</p>
    </div>

    <!-- Card Guru -->
    <div class="role-card text-center" (click)="onRoleSelected('guru')">
      <div class="icon-wrapper">
        <fa-icon [icon]="faChalkboardTeacher" size="5x"></fa-icon>
      </div>
      <p class="role-text">Guru</p>
    </div>
  </div>
</div>

<div class="modal-body position-relative">
  <!-- Icon Warning Overlapping -->
  <div class="icon-warning-wrapper">
    <div class="icon-warning">
      <fa-icon [icon]="faExclamation"></fa-icon>
    </div>
  </div>

  <h5 class="modal-title text-center mt-4">
    Sekolah ditemukan, apakah Anda ingin mengelola sekolah ini ?
  </h5>

  <div class="school-details mt-3 px-3">
    <p>Nama sekolah : {{ school?.sekolah }}</p>
    <p>Kecamatan : {{ school?.kecamatan }}</p>
    <p>Kabupaten : {{ school?.kabupaten_kota }}</p>
    <p>Provinsi : {{ school?.propinsi }}</p>
  </div>

  <div class="d-flex justify-content-between mt-4 px-3">
    <button class="btn btn-outline-primary btn-rounded" (click)="onCreateNewSchool()">
      Batal
    </button>
    <button class="btn btn-primary btn-rounded" (click)="onUseThisSchool()">
      Ya, gunakan sekolah ini
    </button>
  </div>
</div>
